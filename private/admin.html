<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Appointments | Dermiére Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css?v=2">
  <style>
    body { background: #f6f1ea; }
    .admin { padding: 30px 0 80px; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 20px 0; }
    .toolbar > div { min-width: 140px; flex: 1; }
    .toolbar input, .toolbar select { padding: 9px 10px; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick button { padding: 8px 16px; font-size: .85rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
    .stat b { font-family: var(--serif); font-size: 2rem; font-weight: 500; display: block; line-height: 1.1; }
    .stat span { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
    table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: .92rem; vertical-align: top; }
    th { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--cream); font-weight: 500; }
    tr.day-head td { background: #faf6f1; font-family: var(--serif); font-size: 1.15rem; padding: 10px 14px; }
    td .sub { color: var(--muted); font-size: .82rem; }
    td select { padding: 6px 8px; font-size: .85rem; width: auto; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .75rem; }
    .st-pending { background: #fff1d6; } .st-confirmed { background: #dcefe3; } .st-completed { background: #e3e7f3; }
    .st-cancelled { background: #f5dcd8; } .st-no-show { background: #ece6e3; }
    .acts a { font-size: .82rem; margin-right: 10px; color: var(--gold); white-space: nowrap; }
    .tabs { display: flex; gap: 30px; border-bottom: 1px solid var(--line); margin-top: 10px; }
    .tab { background: none; border: 0; padding: 14px 0; font: 300 2rem var(--serif); cursor: pointer; color: var(--muted); border-bottom: 1px solid transparent; margin-bottom: -1px; }
    .tab.is-active { color: var(--ink); border-color: var(--ink); }
    #msgBadge:not(:empty) { font: 500 .7rem var(--sans); background: var(--gold); color: #fff; border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
    .st-new { background: #fff1d6; } .st-replied { background: #dcefe3; } .st-archived { background: #ece6e3; }
    .quick .btn { min-height: 40px; padding: 0 16px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    @media (max-width: 760px) {
      table, tbody, tr, td { display: block; width: 100%; } thead { display: none; }
      tr { border-bottom: 1px solid var(--line); padding: 8px 0; } td { border: 0; padding: 6px 14px; }
      tr.day-head td { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <header class="site-header scrolled">
    <div class="container nav">
      <a href="/" class="brand"><span class="brand-name">Dermiére</span><span class="brand-sub">Admin</span></a>
      <a class="btn btn-outline" href="/api/admin/export.csv">Export CSV</a>
    </div>
  </header>
  <main class="admin container">
    <div class="tabs"><button class="tab is-active" data-tab="appts">Appointments</button><button class="tab" data-tab="msgs">Messages <span id="msgBadge"></span></button></div>
    <div id="tab-appts">
    <div class="toolbar">
      <div><label>From</label><input type="date" id="from"></div>
      <div><label>To</label><input type="date" id="to"></div>
      <div><label>Clinic</label><select id="location"><option value="">All clinics</option></select></div>
      <div><label>Status</label><select id="status"><option value="">All statuses</option><option>pending</option><option>confirmed</option><option>completed</option><option>cancelled</option><option>no-show</option></select></div>
      <div class="quick">
        <button class="btn btn-outline" data-range="today">Today</button>
        <button class="btn btn-outline" data-range="week">Next 7 days</button>
        <button class="btn btn-outline" data-range="all">All</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <table>
      <thead><tr><th>Time</th><th>Patient</th><th>Treatment</th><th>Clinic</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <div id="tab-msgs" class="hidden">
      <table><thead><tr><th>Received</th><th>From</th><th>Topic</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead><tbody id="msgRows"></tbody></table>
    </div>
  </main>
  <script>
  (async function () {
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const cfg = await fetch('/api/config').then((r) => r.json());
    const locName = Object.fromEntries(cfg.locations.map((l) => [l.id, l.name]));
    const svcName = Object.fromEntries(cfg.services.map((s) => [s.id, s.name]));
    cfg.locations.forEach((l) => $('#location').insertAdjacentHTML('beforeend', `<option value="${l.id}">${esc(l.name)}</option>`));
    const fmt12 = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };
    const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
    const waNumber = (p) => { let d = p.replace(/\D/g, ''); if (d.startsWith('0')) d = '92' + d.slice(1); return d; };

    function setRange(r) {
      if (r === 'today') { $('#from').value = cfg.today; $('#to').value = cfg.today; }
      if (r === 'week') { $('#from').value = cfg.today; $('#to').value = addDays(cfg.today, 7); }
      if (r === 'all') { $('#from').value = ''; $('#to').value = ''; }
      load();
    }
    document.querySelectorAll('[data-range]').forEach((b) => b.onclick = () => setRange(b.dataset.range));
    ['from', 'to', 'location', 'status'].forEach((id) => $('#' + id).onchange = load);

    async function load() {
      const q = new URLSearchParams();
      ['from', 'to', 'location', 'status'].forEach((id) => { if ($('#' + id).value) q.set(id, $('#' + id).value); });
      const { appointments } = await fetch('/api/admin/appointments?' + q).then((r) => r.json());
      const count = (s) => appointments.filter((a) => a.status === s).length;
      $('#stats').innerHTML = [['Total', appointments.length], ['Pending', count('pending')], ['Confirmed', count('confirmed')], ['Completed', count('completed')], ['Cancelled', count('cancelled')]]
        .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
      if (!appointments.length) { $('#rows').innerHTML = '<tr><td colspan="6" class="empty">No appointments for this filter.</td></tr>'; return; }
      let html = '', lastDate = '';
      for (const a of appointments) {
        if (a.date !== lastDate) { html += `<tr class="day-head"><td colspan="6">${fmtDate(a.date)}</td></tr>`; lastDate = a.date; }
        const msg = `Assalam o Alaikum ${a.name}, this is Dermiére Aesthetic & Wellness Clinic. Your appointment for ${svcName[a.service] || a.service} at our ${locName[a.location] || a.location} clinic on ${fmtDate(a.date)} at ${fmt12(a.time)} is confirmed. Ref: ${a.ref}. See you soon!`;
        html += `<tr>
          <td><b>${fmt12(a.time)}</b><div class="sub">${esc(a.ref)}</div></td>
          <td>${esc(a.name)}<div class="sub">${esc(a.phone)}${a.email ? ' &middot; ' + esc(a.email) : ''}</div>${a.notes ? `<div class="sub">&ldquo;${esc(a.notes)}&rdquo;</div>` : ''}</td>
          <td>${esc(svcName[a.service] || a.service)}</td>
          <td>${esc(locName[a.location] || a.location)}</td>
          <td><select data-id="${a.id}" class="pill st-${a.status}">${['pending', 'confirmed', 'completed', 'cancelled', 'no-show'].map((s) => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
          <td class="acts"><a target="_blank" rel="noopener" href="https://wa.me/${waNumber(a.phone)}?text=${encodeURIComponent(msg)}">WhatsApp</a><a href="tel:${esc(a.phone)}">Call</a></td>
        </tr>`;
      }
      $('#rows').innerHTML = html;
    }
    $('#rows').addEventListener('change', async (e) => {
      if (!e.target.matches('select[data-id]')) return;
      const res = await fetch('/api/admin/appointments/' + e.target.dataset.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: e.target.value }) });
      if (!res.ok) alert('Could not update status.');
      load();
    });
    // Messages
    document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('is-active', x === t));
      $('#tab-appts').classList.toggle('hidden', t.dataset.tab !== 'appts');
      $('#tab-msgs').classList.toggle('hidden', t.dataset.tab !== 'msgs');
    });
    async function loadMsgs() {
      const { messages } = await fetch('/api/admin/messages').then((r) => r.json());
      const n = messages.filter((m) => m.status === 'new').length;
      $('#msgBadge').textContent = n || '';
      if (!messages.length) { $('#msgRows').innerHTML = '<tr><td colspan="6" class="empty">No messages yet.</td></tr>'; return; }
      $('#msgRows').innerHTML = messages.map((m) => `<tr>
        <td>${esc(m.created_at.slice(0, 16))}<div class="sub">UTC</div></td>
        <td>${esc(m.name)}<div class="sub">${esc(m.phone)}${m.email ? ' &middot; ' + esc(m.email) : ''}</div></td>
        <td>${esc(m.topic || '')}</td>
        <td style="max-width:380px">${esc(m.message)}</td>
        <td><select data-mid="${m.id}" class="pill st-${m.status}">${['new', 'replied', 'archived'].map((s) => `<option ${s === m.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
        <td class="acts"><a target="_blank" rel="noopener" href="https://wa.me/${waNumber(m.phone)}?text=${encodeURIComponent('Assalam o Alaikum ' + m.name + ', thank you for contacting Dermiére Aesthetic & Wellness Clinic. ')}">WhatsApp</a><a href="tel:${esc(m.phone)}">Call</a></td></tr>`).join('');
    }
    $('#msgRows').addEventListener('change', async (e) => {
      if (!e.target.matches('select[data-mid]')) return;
      await fetch('/api/admin/messages/' + e.target.dataset.mid, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: e.target.value }) });
      loadMsgs();
    });
    loadMsgs();
    setRange('week');
  })();
  </script>
</body>
</html>
